name: Tests

# Every pull request, plus merges to main that touch the Unity project: that run tests the merged
# result and saves the Library cache that later pull requests start from.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['Assets/**', 'Packages/**', 'ProjectSettings/**']
  workflow_dispatch:

# A newer run for the same pull request (or main) cancels the earlier one.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editmode:
    # Runs play mode too. The name stays: it's the required status check in main's ruleset.
    name: Edit-mode tests
    # One Unity job at a time across workflows, so jobs don't compete for the license seat.
    concurrency:
      group: unity-license
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        plant: [burst, ilpp]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Test-

      # Experiment: point one Library pid file at PID 128, which is the Unity editor's main thread
      # or one of its first threads in every first launch seen so far (Unity gets 124 to 126).
      - name: Plant a stale pid in Library/${{ matrix.plant }}.pid
        run: |
          rm -f Library/burst.pid Library/ilpp.pid
          printf 128 > Library/${{ matrix.plant }}.pid
          ls -la Library/*.pid

      - name: Burst package source
        if: matrix.plant == 'burst'
        uses: actions/upload-artifact@v7
        with:
          name: burst-package
          path: |
            Library/PackageCache/com.unity.burst*/**/*.cs
            Library/PackageCache/com.unity.burst*/package.json

      - name: Record SIGKILLs
        run: |
          t=/sys/kernel/tracing
          echo 1 | sudo tee $t/options/record-tgid > /dev/null
          echo 'sig == 9 || sig == 11 || sig == 6 || sig == 7 || sig == 4 || sig == 8 || sig == 5' | sudo tee $t/events/signal/signal_generate/filter > /dev/null
          echo 1 | sudo tee $t/events/signal/signal_generate/enable > /dev/null
          for s in kill tgkill tkill; do
            echo 'sig == 9' | sudo tee $t/events/syscalls/sys_enter_$s/filter > /dev/null
            echo 1 | sudo tee $t/events/syscalls/sys_enter_$s/enable > /dev/null
          done
          echo 1 | sudo tee $t/events/task/task_rename/enable > /dev/null

      - name: Library PID files (restored)
        continue-on-error: true
        run: |
          set +e +o pipefail
          echo "Small files holding only a number:"
          find Library -maxdepth 4 -type f -size -64c -print0 | while IFS= read -r -d '' f; do
            c=$(tr -d '\0' < "$f"); [[ "$c" =~ ^[[:space:]]*-?[0-9]+[[:space:]]*$ ]] && echo "  $f: $c ($(stat -c '%y' "$f"))"
          done
          echo "Files mentioning a pid:"
          grep -rlisE '"?(process_?id|pid)"?[[:space:]]*[:=]' Library --include='*.json' --include='*.txt' --include='*.pid' 2>/dev/null | head -20
          for f in Library/EditorInstance.json Library/ilpp.pid Library/MSBuild/buildhost.pid; do echo "--- $f"; cat "$f" 2>/dev/null || echo "(none)"; echo; done
          ls -la Library Library/MSBuild 2>/dev/null

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          # Edit mode: unit tests. Play mode: the flight scene with each vehicle, the PX4 bridge
          # against a fake PX4.
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results
          # Coverage is on by default (coverageEnabled) and uses the Code Coverage package from the
          # project's Engineering feature set. Only the sim's own assembly is measured, not the
          # tests or packages; dontClear keeps every test run's results for the merged report.
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;dontClear;assemblyFilters:+DroneSim'

      - name: Library PID files (after tests)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set +e +o pipefail
          echo "Small files holding only a number:"
          find Library -maxdepth 4 -type f -size -64c -print0 | while IFS= read -r -d '' f; do
            c=$(tr -d '\0' < "$f"); [[ "$c" =~ ^[[:space:]]*-?[0-9]+[[:space:]]*$ ]] && echo "  $f: $c ($(stat -c '%y' "$f"))"
          done
          echo "Files mentioning a pid:"
          grep -rlisE '"?(process_?id|pid)"?[[:space:]]*[:=]' Library --include='*.json' --include='*.txt' --include='*.pid' 2>/dev/null | head -20
          for f in Library/EditorInstance.json Library/ilpp.pid Library/MSBuild/buildhost.pid; do echo "--- $f"; cat "$f" 2>/dev/null || echo "(none)"; echo; done
          ls -la Library Library/MSBuild 2>/dev/null

      - name: Kill report
        if: ${{ !cancelled() }}
        run: |
          echo "SIGKILLs: the sending task first, then the target. code=128 means the kernel sent it (OOM killer)."
          sudo grep -E 'signal_generate|sys_kill|sys_tgkill|sys_tkill' /sys/kernel/tracing/trace || echo "none recorded"
          echo "Thread renames:"
          sudo grep task_rename /sys/kernel/tracing/trace | head -300
          echo
          echo "Runner memory (game-ci caps the container at 95% of it):"
          free -m
          echo
          sudo dmesg -T | grep -iE -A30 'out of memory|oom-kill|killed process' || echo "no OOM kill in the kernel log"

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: python3 tools/coverage_summary.py CodeCoverage >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.plant }}
          path: CodeCoverage
          if-no-files-found: warn
