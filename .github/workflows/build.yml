name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Shared with the test workflow: one Unity job at a time for the license seat.
concurrency:
  group: unity-license
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneLinux64, StandaloneWindows64, StandaloneOSX]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: drone-sim
          buildsPath: build

      - uses: actions/upload-artifact@v7
        with:
          name: drone-sim-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  # Runs the Linux player headless against tools/sim_smoke_test.py, which plays PX4's side of the
  # HIL link, once per shipped vehicle. Catches a build that starts but can't fly: missing
  # StreamingAssets, a broken bridge, physics that differs from the editor. No Unity license needed.
  smoke:
    name: Smoke test Linux player
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: drone-sim-StandaloneLinux64
          path: player

      - name: Fly each vehicle against a fake PX4
        run: |
          exe=player/drone-sim.x86_64
          [ -f "$exe" ] || exe=player/drone-sim
          chmod +x "$exe"   # artifacts don't keep the executable bit
          status=0
          for spec in Assets/StreamingAssets/vehicles/*.json; do
            vehicle=$(basename "$spec" .json)
            echo "::group::$vehicle"
            "$exe" -batchmode -nographics -logFile "player-$vehicle.log" --no-ros --vehicle "$vehicle" &
            pid=$!
            python3 tools/sim_smoke_test.py "$vehicle" || status=1
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            if grep -q "Exception" "player-$vehicle.log"; then
              echo "::warning::exceptions in the $vehicle player log, see the smoke-test-logs artifact"
            fi
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: smoke-test-logs
          path: player-*.log

  release:
    name: Draft release
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Zip each platform
        run: |
          mkdir release
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -qr -9 "$GITHUB_WORKSPACE/release/$name.zip" .)
          done

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip
          draft: true
          generate_release_notes: true
